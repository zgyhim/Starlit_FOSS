[package]
name = "starlit-foss"
version = "0.1.0"
description = "Starlit FOSS desktop application"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "starlit_foss_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.3", features = ["full"] }
serde_yaml = "0.9.34"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
chrono = "0.4.45"
thiserror = "2.0.21"
open = "5.4.5"
tauri-plugin-single-instance = "2.4.5"
zstd = "0.14.3"
tar = "0.4.46"
sha2 = "0.10.9"
percent-encoding = "2.3.2"
base64 = "0.23.1"
tauri-plugin-dialog = "2.7.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
