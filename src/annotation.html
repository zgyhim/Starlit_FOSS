<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>星伴 · 对话打标台</title>
  <style>
    :root{--bg:#f5f3ee;--panel:#fffdfa;--panel2:#f0ede6;--text:#292724;--muted:#777168;--line:#ded9cf;--accent:#9b6253;--accent2:#f2e3dc;--good:#28745a;--problem:#9a661c;--severe:#a43f3f;--shadow:0 18px 50px #493b2b12}
    @media(prefers-color-scheme:dark){:root{--bg:#191918;--panel:#232321;--panel2:#2c2b28;--text:#eeeae2;--muted:#aaa398;--line:#403d38;--accent:#d79a86;--accent2:#49352f;--good:#72c5a4;--problem:#e0b269;--severe:#ed9191;--shadow:0 18px 50px #0005}}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}.top{min-height:76px;padding:16px 24px;display:flex;align-items:center;gap:18px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}.brand{min-width:220px}.brand h1{font-size:19px;margin:0;letter-spacing:.02em}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}.meta{display:flex;gap:8px;flex-wrap:wrap;flex:1}.pill{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:99px;padding:3px 10px;color:var(--muted);font-size:12px;background:var(--panel2)}.pill.warn{color:var(--problem);border-color:color-mix(in srgb,var(--problem) 40%,var(--line))}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 13px}.btn:hover{background:var(--panel2)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.workspace{display:grid;grid-template-columns:320px minmax(0,1fr);max-width:1440px;margin:22px auto;padding:0 20px;gap:18px;min-height:calc(100vh - 120px)}.sidebar,.detail{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.sidebar{align-self:start;position:sticky;top:98px;overflow:hidden}.summary{padding:16px;border-bottom:1px solid var(--line)}.progress-line{display:flex;justify-content:space-between;margin-bottom:8px}.progress{height:6px;background:var(--panel2);border-radius:9px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px;border-bottom:1px solid var(--line)}.filters input,.filters select{min-width:0;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px}.filters input{grid-column:1/-1}.sample-list{max-height:calc(100vh - 330px);min-height:220px;overflow:auto;padding:8px}.sample-item{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:11px 10px;border-radius:9px}.sample-item:hover,.sample-item.active{background:var(--panel2)}.sample-item.active{box-shadow:inset 3px 0 var(--accent)}.sample-title{display:flex;justify-content:space-between;gap:10px;font-weight:600}.sample-sub{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px;margin-top:3px}.rating-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;background:var(--line)}.rating-dot.good{background:var(--good)}.rating-dot.problem{background:var(--problem)}.rating-dot.severe{background:var(--severe)}.detail{min-width:0;padding:24px}.empty{display:grid;place-items:center;text-align:center;min-height:55vh;color:var(--muted)}.detail-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.detail h2{margin:0 0 4px;font-size:22px}.sample-id{font:11px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--muted);word-break:break-all}.nav{display:flex;gap:6px}.nav button{padding:6px 10px}.section{margin-top:22px}.section h3{font-size:13px;color:var(--muted);letter-spacing:.08em;margin:0 0 10px}.conversation{border:1px solid var(--line);border-radius:12px;overflow:hidden}.context-toggle{width:100%;text-align:left;border:0;background:var(--panel2);padding:10px 13px}.context-body{padding:12px;max-height:330px;overflow:auto}.context-body[hidden]{display:none}.message{margin:7px 0;display:flex}.message.user{justify-content:flex-end}.bubble{max-width:82%;padding:8px 12px;border-radius:12px;background:var(--panel2);white-space:pre-wrap;word-break:break-word}.message.user .bubble{background:var(--accent2)}.response{padding:17px;border-radius:13px;background:var(--accent2);border:1px solid color-mix(in srgb,var(--accent) 22%,var(--line));font-size:16px;white-space:pre-wrap;word-break:break-word;min-height:58px}.response-segment+.response-segment{margin-top:7px;padding-top:7px;border-top:1px dashed color-mix(in srgb,var(--accent) 20%,transparent)}.rating-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.rating{padding:13px;border:1px solid var(--line);border-radius:11px;background:var(--panel);font-weight:650}.rating small{display:block;font-weight:400;color:var(--muted);margin-top:2px}.rating.good.selected{border-color:var(--good);color:var(--good);background:color-mix(in srgb,var(--good) 9%,var(--panel))}.rating.problem.selected{border-color:var(--problem);color:var(--problem);background:color-mix(in srgb,var(--problem) 9%,var(--panel))}.rating.severe.selected{border-color:var(--severe);color:var(--severe);background:color-mix(in srgb,var(--severe) 9%,var(--panel))}.issues{display:flex;flex-wrap:wrap;gap:8px}.issue{border:1px solid var(--line);background:var(--panel);padding:6px 11px;border-radius:99px}.issue.selected{border-color:var(--accent);background:var(--accent2);color:var(--accent)}.field{width:100%;resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px;margin-top:8px;min-height:76px}.field::placeholder{color:var(--muted)}details.auto{margin-top:20px;border-top:1px solid var(--line);padding-top:14px;color:var(--muted)}details.auto summary{cursor:pointer}.auto-score{font-size:22px;color:var(--text);font-weight:700}.failure{padding:8px 0;border-bottom:1px solid var(--line)}.failure code{color:var(--severe)}.footnote{color:var(--muted);font-size:12px;margin-top:20px}.status{min-height:20px;color:var(--good);font-size:12px;margin-top:8px}.hidden{display:none!important}.mobile-bar{display:none}
    @media(max-width:850px){.top{position:static;padding:14px;flex-wrap:wrap}.brand{min-width:0;flex:1}.meta{order:3;flex-basis:100%}.workspace{display:block;padding:0 12px;margin:12px auto}.sidebar{position:static;margin-bottom:12px}.sample-list{max-height:230px;min-height:0}.detail{padding:17px}.rating-grid{grid-template-columns:1fr}.rating small{display:inline;margin-left:6px}.detail-head{flex-direction:column}.nav{width:100%}.nav button{flex:1}}
  </style>
</head>
<body>
<header class="top">
  <div class="brand"><h1>星伴 · 对话打标台</h1><p>人工判断优先，自动评分只用于筛查</p></div>
  <div class="meta" id="datasetMeta"></div>
  <div class="actions">
    <button class="btn" id="importBtn">导入样本</button>
    <input id="fileInput" type="file" accept=".json,application/json" hidden>
    <button class="btn primary" id="exportBtn">导出已打标 JSONL</button>
  </div>
</header>
<main class="workspace">
  <aside class="sidebar">
    <div class="summary"><div class="progress-line"><span id="progressText">尚未载入样本</span><span id="saveState"></span></div><div class="progress"><i id="progressBar"></i></div></div>
    <div class="filters">
      <input id="searchInput" type="search" placeholder="搜索场景、正文或样本 ID" aria-label="搜索样本">
      <select id="ratingFilter" aria-label="按标签筛选"><option value="all">全部标签</option><option value="unlabeled">未打标</option><option value="good">好</option><option value="problem">有问题</option><option value="severe">严重问题</option></select>
      <select id="sourceFilter" aria-label="按来源筛选"><option value="all">全部来源</option><option value="scenario">场景评测</option><option value="self_dialogue">多轮自对话</option></select>
    </div>
    <div class="sample-list" id="sampleList"></div>
  </aside>
  <section class="detail" id="detail"><div class="empty"><div><h2>选择一条样本开始打标</h2><p>原始样本不会被修改，标签自动保存在当前浏览器</p></div></div></section>
</main>
<script id="sample-data" type="application/json">null</script>
<script>
'use strict';
const ISSUES=['人设不符','记忆错误','复读或模板腔','情绪不贴切','追问或施压','啰嗦或不自然','事实错误','安全或边界','其他'];
const RATINGS={good:'好',problem:'有问题',severe:'严重问题'};
const state={bundle:null,samples:[],labels:{},selected:'',filter:'all',source:'all',search:''};
const $=id=>document.getElementById(id);
function node(tag,className,text){const el=document.createElement(tag);if(className)el.className=className;if(text!==undefined)el.textContent=text;return el}
function button(text,className,onClick){const el=node('button',className,text);el.type='button';el.addEventListener('click',onClick);return el}
function fingerprint(samples){const text=samples.map(x=>x.sample_id).join('|');let h=2166136261;for(let i=0;i<text.length;i++){h^=text.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16)}
function storageKey(){return state.bundle?'starlit.annotation.v1.'+fingerprint(state.samples):''}
function isExecutionError(sample){return ((sample.automatic||{}).failures||[]).some(x=>x.rule==='execution_error')}
function labelFor(id){return state.labels[id]||{rating:'',issues:[],note:'',preferred_response:''}}
function ensureLabel(id){if(!state.labels[id])state.labels[id]={rating:'',issues:[],note:'',preferred_response:''};return state.labels[id]}
function saveLabels(){if(!storageKey())return;localStorage.setItem(storageKey(),JSON.stringify(state.labels));$('saveState').textContent='已自动保存';setTimeout(()=>{$('saveState').textContent=''},1000)}
function loadBundle(bundle){
  if(!bundle||bundle.spec!=='starlit.quality_samples'||!Array.isArray(bundle.samples))throw new Error('不是有效的星伴打标样本文件');
  const ids=new Set();
  for(const sample of bundle.samples){
    if(!sample||typeof sample.sample_id!=='string'||!sample.sample_id||ids.has(sample.sample_id))throw new Error('样本 ID 缺失或重复');
    if(!Array.isArray(sample.request_messages)||typeof sample.response!=='string')throw new Error('样本缺少原始消息或回复');
    ids.add(sample.sample_id);
  }
  state.bundle=bundle;state.samples=bundle.samples;state.selected=state.samples[0]?state.samples[0].sample_id:'';state.labels={};
  try{
    const saved=JSON.parse(localStorage.getItem(storageKey())||'{}');
    for(const sample of state.samples){
      const old=saved[sample.sample_id];
      if(old&&typeof old==='object')state.labels[sample.sample_id]={rating:RATINGS[old.rating]?old.rating:'',issues:Array.isArray(old.issues)?old.issues.filter(x=>ISSUES.includes(x)):[],note:String(old.note||''),preferred_response:String(old.preferred_response||''),labeled_at:String(old.labeled_at||'')};
    }
  }catch(e){console.warn('标签读取失败',e)}
  renderAll();
}
function renderMeta(){const meta=$('datasetMeta');meta.replaceChildren();if(!state.bundle)return;meta.append(node('span','pill',state.bundle.model||'未知模型'));const mode=state.bundle.mode||'未知模式';meta.append(node('span','pill'+(String(mode).includes('mock')?' warn':''),mode));meta.append(node('span','pill','仅合成样本'));if(String(mode).includes('mock'))meta.append(node('span','pill warn','Mock 不代表真实质量'))}
function filteredSamples(){const query=state.search.toLowerCase();return state.samples.filter(sample=>{const rating=labelFor(sample.sample_id).rating;if(state.filter==='unlabeled'&&rating)return false;if(state.filter!=='all'&&state.filter!=='unlabeled'&&rating!==state.filter)return false;if(state.source!=='all'&&sample.source!==state.source)return false;if(query){const haystack=[sample.sample_id,sample.title,sample.response,...sample.request_messages.map(x=>x.content)].join('\n').toLowerCase();if(!haystack.includes(query))return false}return true})}
function renderList(){const list=$('sampleList');list.replaceChildren();const samples=filteredSamples();if(!samples.length){list.append(node('p','empty','没有符合筛选条件的样本'));return}for(const sample of samples){const rating=labelFor(sample.sample_id).rating;const item=button('', 'sample-item'+(sample.sample_id===state.selected?' active':''),()=>{state.selected=sample.sample_id;renderAll()});const title=node('span','sample-title');title.append(node('span','',sample.title||sample.scenario_id||sample.sample_id));const mark=node('span','',RATINGS[rating]||'未标');mark.style.color=rating==='good'?'var(--good)':rating==='problem'?'var(--problem)':rating==='severe'?'var(--severe)':'var(--muted)';title.append(mark);const sub=node('span','sample-sub');const origin=sample.source==='self_dialogue'?'自对话':'场景';sub.append(node('span','',origin+' · 第 '+((sample.turn_index??sample.sample_index??0)+1)+' 条'));const id=node('span','sample-id',sample.sample_id.slice(0,12));sub.append(id);item.append(title,sub);list.append(item)}}
function renderProgress(){const labelable=state.samples.filter(x=>!isExecutionError(x));const done=labelable.filter(x=>!!labelFor(x.sample_id).rating).length;$('progressText').textContent=state.samples.length?`已打标 ${done} / ${labelable.length}`:'尚未载入样本';$('progressBar').style.width=labelable.length?(done/labelable.length*100)+'%':'0'}
function contextMessages(sample){if(Array.isArray(sample.conversation)&&sample.conversation.length)return sample.conversation;return sample.request_messages.filter(x=>x.role!=='system')}
function renderConversation(sample){const wrap=node('div','conversation');const messages=contextMessages(sample);const toggle=button('查看本轮之前的对话（'+Math.max(0,messages.length-1)+' 条）','context-toggle',()=>{body.hidden=!body.hidden;toggle.textContent=(body.hidden?'查看':'收起')+'本轮之前的对话（'+Math.max(0,messages.length-1)+' 条）'});const body=node('div','context-body');body.hidden=true;for(const message of messages){const line=node('div','message '+(message.role==='user'?'user':''));line.append(node('div','bubble',String(message.text??message.content??'')));body.append(line)}wrap.append(toggle,body);return wrap}
function renderAuto(sample){const details=node('details','auto');const summary=node('summary','','先看正文独立判断，再展开自动检查');details.append(summary);const auto=sample.automatic||{};details.append(node('div','auto-score',(auto.score??'—')+' / 100'));details.append(node('p','',auto.passed?'规则筛查通过；不代表人工达标。':'有规则命中；也可能误报，请结合原文判断。'));const failures=auto.failures||[];if(!failures.length)details.append(node('p','','未触发内置规则'));for(const failure of failures){const row=node('div','failure');row.append(node('code','',failure.rule||'rule'),document.createTextNode('  '+(failure.reason||'')));details.append(row)}return details}
function renderDetail(){const detail=$('detail');detail.replaceChildren();const sample=state.samples.find(x=>x.sample_id===state.selected);if(!sample){detail.append(node('div','empty','请选择样本'));return}const label=labelFor(sample.sample_id);const head=node('div','detail-head');const heading=node('div');heading.append(node('h2','',sample.title||sample.scenario_id));heading.append(node('div','sample-id',sample.sample_id));const nav=node('div','nav');const index=state.samples.indexOf(sample);nav.append(button('上一条','btn',()=>{if(index>0){state.selected=state.samples[index-1].sample_id;renderAll()}}),button('下一条未标','btn',()=>{const next=state.samples.slice(index+1).find(x=>!labelFor(x.sample_id).rating&&!isExecutionError(x))||state.samples.find(x=>!labelFor(x.sample_id).rating&&!isExecutionError(x));if(next){state.selected=next.sample_id;renderAll()}}));head.append(heading,nav);detail.append(head);
  if(isExecutionError(sample)){const warning=node('p','pill warn','这是模型调用执行错误，不纳入训练打标');detail.append(warning)}
  const contextSection=node('section','section');contextSection.append(node('h3','','对话上下文'),renderConversation(sample));detail.append(contextSection);
  const responseSection=node('section','section');responseSection.append(node('h3','','星野的回复'));const response=node('div','response',sample.response||'（空回复）');responseSection.append(response);detail.append(responseSection);
  const ratingSection=node('section','section');ratingSection.append(node('h3','','你的判断（快捷键 1 / 2 / 3）'));const grid=node('div','rating-grid');const descriptions={good:'自然、合适，可保留',problem:'能看懂，但明显需要改',severe:'错误、伤人或严重出戏'};for(const rating of Object.keys(RATINGS)){const b=button('',`rating ${rating} ${label.rating===rating?'selected':''}`,()=>{if(isExecutionError(sample))return;const target=ensureLabel(sample.sample_id);target.rating=target.rating===rating?'':rating;target.labeled_at=target.rating?new Date().toISOString():'';saveLabels();renderAll()});b.append(document.createTextNode(RATINGS[rating]),node('small','',descriptions[rating]));b.disabled=isExecutionError(sample);grid.append(b)}ratingSection.append(grid);detail.append(ratingSection);
  const issueSection=node('section','section');issueSection.append(node('h3','','问题类型（可多选）'));const issues=node('div','issues');for(const issue of ISSUES){issues.append(button(issue,'issue '+(label.issues.includes(issue)?'selected':''),()=>{const target=ensureLabel(sample.sample_id);target.issues=target.issues.includes(issue)?target.issues.filter(x=>x!==issue):[...target.issues,issue];saveLabels();renderDetail()}))}issueSection.append(issues);detail.append(issueSection);
  const noteSection=node('section','section');noteSection.append(node('h3','','备注与更好的写法（可选）'));const note=node('textarea','field');note.placeholder='哪里好或哪里不对？例如：接住了情绪，但第二句又变成说教';note.value=label.note;note.addEventListener('input',()=>{ensureLabel(sample.sample_id).note=note.value;saveLabels()});const preferred=node('textarea','field');preferred.placeholder='如果你知道更自然的回复，可以写在这里；导出时会作为 chosen 候选';preferred.value=label.preferred_response;preferred.addEventListener('input',()=>{ensureLabel(sample.sample_id).preferred_response=preferred.value;saveLabels()});noteSection.append(note,preferred);detail.append(noteSection,renderAuto(sample));detail.append(node('p','footnote','快捷键：1 好，2 有问题，3 严重问题，J / K 切换上下条。标签与原始样本分开保存，导出不会包含未打标样本。'))}
function renderAll(){renderMeta();renderProgress();renderList();renderDetail()}
function selectRating(rating){const sample=state.samples.find(x=>x.sample_id===state.selected);if(!sample||isExecutionError(sample))return;const label=ensureLabel(sample.sample_id);label.rating=rating;label.labeled_at=new Date().toISOString();saveLabels();renderAll()}
function exportJsonl(){if(!state.bundle)return alert('请先导入样本');const lines=[];let skipped=0;for(const sample of state.samples){const label=labelFor(sample.sample_id);if(!label.rating)continue;if(isExecutionError(sample)){skipped++;continue}const record={spec:'starlit.quality_label',spec_version:1,dataset_fingerprint:fingerprint(state.samples),sample_id:sample.sample_id,source:sample.source,scenario_id:sample.scenario_id,session_id:sample.session_id||'',turn_index:sample.turn_index??sample.sample_index??0,mode:state.bundle.mode,model:state.bundle.model,messages:sample.request_messages,response:sample.response,bubbles:sample.bubbles||[],automatic:sample.automatic||{},label:{rating:label.rating,issues:label.issues,note:label.note,preferred_response:label.preferred_response,labeled_at:label.labeled_at||new Date().toISOString()},target:{chosen:label.preferred_response||(label.rating==='good'?sample.response:''),rejected:label.rating==='good'?'':sample.response}};lines.push(JSON.stringify(record))}if(!lines.length)return alert('还没有可导出的已打标样本');const blob=new Blob([lines.join('\n')+'\n'],{type:'application/x-ndjson;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\..+/,'').replace('T','-');a.download='starlit-labels-'+stamp+'.jsonl';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);alert('已导出 '+lines.length+' 条标签'+(skipped?'，跳过 '+skipped+' 条执行错误':''))}
$('importBtn').addEventListener('click',()=>$('fileInput').click());$('fileInput').addEventListener('change',async event=>{const file=event.target.files[0];if(!file)return;try{loadBundle(JSON.parse(await file.text()))}catch(error){alert('导入失败：'+error.message)}event.target.value=''});$('exportBtn').addEventListener('click',exportJsonl);$('ratingFilter').addEventListener('change',e=>{state.filter=e.target.value;renderList()});$('sourceFilter').addEventListener('change',e=>{state.source=e.target.value;renderList()});$('searchInput').addEventListener('input',e=>{state.search=e.target.value.trim();renderList()});document.addEventListener('keydown',event=>{if(event.target.matches('textarea,input,select'))return;if(event.key==='1')selectRating('good');if(event.key==='2')selectRating('problem');if(event.key==='3')selectRating('severe');if(event.key.toLowerCase()==='j'||event.key.toLowerCase()==='k'){const index=state.samples.findIndex(x=>x.sample_id===state.selected);const next=event.key.toLowerCase()==='j'?Math.min(state.samples.length-1,index+1):Math.max(0,index-1);if(next>=0&&state.samples[next]){state.selected=state.samples[next].sample_id;renderAll()}}});
const embedded=JSON.parse($('sample-data').textContent);if(embedded)loadBundle(embedded);else renderAll();
</script>
</body>
</html>
